<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI漫剧选题分析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@2.0.1/dist/chartjs-chart-matrix.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg-primary:#f4f5f7;--bg-secondary:#e8eaee;--bg-card:#fff;--bg-card-hover:#f8f9fb;
--border-color:#e2e4e8;--border-hover:#c8cbd0;
--text-primary:#1a1a2e;--text-secondary:#555;--text-muted:#888;
--accent-dark:#333;--accent-black:#000;
--accent-red:#b91c1c;--accent-green:#166534;--accent-orange:#92400e;
--sidebar-width:220px;--sidebar-bg:#fff;
--radius-sm:6px;--radius-md:10px;--radius-lg:16px;
--shadow-card:0 1px 4px rgba(0,0,0,0.06);--shadow-hover:0 6px 16px rgba(0,0,0,0.1);--transition:0.2s ease
}
html{font-size:14px}
body{
font-family:'Inter','PingFang SC','Microsoft YaHei',-apple-system,sans-serif;
background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow:hidden
}
.app-layout{display:flex;height:100vh}
.sidebar{
width:var(--sidebar-width);min-width:var(--sidebar-width);background:var(--sidebar-bg);
border-right:1px solid var(--border-color);display:flex;flex-direction:column;padding:24px 0;gap:4px;z-index:2
}
.sidebar-brand{padding:0 20px 24px;border-bottom:1px solid var(--border-color);margin-bottom:12px}
.sidebar-brand h1{font-size:1.15rem;font-weight:800;color:var(--text-primary);line-height:1.3}
.sidebar-brand small{font-size:.7rem;color:var(--text-muted);display:block;margin-top:2px;font-weight:500;letter-spacing:.5px}
.nav-item{
display:flex;align-items:center;gap:12px;padding:11px 20px;margin:1px 10px;border-radius:var(--radius-sm);
cursor:pointer;color:var(--text-secondary);transition:all var(--transition);font-size:.85rem;font-weight:500;
border:none;background:none;width:calc(100% - 20px);text-align:left
}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-item:hover{background:var(--bg-secondary);color:var(--text-primary)}
.nav-item.active{background:var(--bg-secondary);color:var(--accent-black);font-weight:600;box-shadow:inset 3px 0 0 var(--accent-black)}
.nav-item .badge{margin-left:auto;background:var(--bg-secondary);color:var(--text-secondary);font-size:.65rem;padding:2px 7px;border-radius:10px;font-weight:600}
.main-content{flex:1;overflow-y:auto;overflow-x:hidden;padding:28px 32px 40px;scrollbar-width:thin;scrollbar-color:var(--border-color) transparent}
.main-content::-webkit-scrollbar{width:4px}
.main-content::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:2px}
.page{display:none}
.page.active{display:block}
.section-title{font-size:1.3rem;font-weight:700;margin-bottom:20px}
.card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:20px;box-shadow:var(--shadow-card);transition:all var(--transition)}
.card:hover{box-shadow:var(--shadow-hover)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:.82rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:20px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-card);transition:all var(--transition)}
.kpi-card:hover{box-shadow:var(--shadow-hover)}
.kpi-card .kpi-label{font-size:.75rem;color:var(--text-muted);font-weight:500}
.kpi-card .kpi-value{font-size:1.6rem;font-weight:800;color:var(--text-primary);letter-spacing:-.5px}
.kpi-card .kpi-change{font-size:.72rem;color:var(--text-muted)}
.kpi-change.up{color:var(--accent-green);font-weight:600}
.kpi-change.down{color:var(--accent-red);font-weight:600}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.two-col-wide{display:grid;grid-template-columns:7fr 3fr;gap:16px;margin-bottom:20px}
.two-col-narrow{display:grid;grid-template-columns:6fr 4fr;gap:16px;margin-bottom:20px}
.full-row{margin-bottom:20px}
.tag-cloud{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;padding:6px 14px;border-radius:20px;font-size:.8rem;font-weight:500;background:var(--bg-secondary);color:var(--text-secondary);border:1px solid var(--border-color);cursor:default;transition:all var(--transition)}
.tag:hover{background:var(--border-color)}
.tag-lg{font-size:.95rem;padding:8px 18px}
.cover-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.cover-item{aspect-ratio:9/16;border-radius:var(--radius-sm);background-size:cover;position:relative;cursor:pointer;overflow:hidden;border:1px solid var(--border-color);transition:all var(--transition)}
.cover-item:hover{transform:scale(1.03);border-color:var(--accent-dark)}
.cover-item .cover-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.85) 0%,transparent 50%);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;opacity:0;transition:opacity var(--transition)}
.cover-item:hover .cover-overlay{opacity:1}
.cover-overlay span{font-size:.6rem;color:rgba(255,255,255,0.85)}
.cover-overlay .stat{font-weight:700;color:#fff}
.chart-container{position:relative;width:100%;height:280px}
.chart-container-lg{position:relative;width:100%;height:320px}
.data-table{width:100%;border-collapse:collapse}
.data-table th{text-align:left;padding:10px 14px;font-size:.72rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border-color);cursor:pointer;user-select:none;white-space:nowrap}
.data-table th:hover{color:var(--text-secondary)}
.data-table th .sort-icon{margin-left:4px;opacity:.4}
.data-table td{padding:12px 14px;border-bottom:1px solid var(--bg-secondary);font-size:.82rem;color:var(--text-secondary)}
.data-table tr:hover td{background:var(--bg-card-hover)}
.data-table td:first-child{font-weight:600;color:var(--text-primary)}
.score-bar{display:inline-block;height:6px;border-radius:3px;background:var(--text-primary);vertical-align:middle;margin-right:6px;opacity:.15}
.filter-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.filter-btn{padding:6px 16px;border-radius:20px;border:1px solid var(--border-color);background:transparent;color:var(--text-secondary);font-size:.78rem;cursor:pointer;transition:all var(--transition);font-family:inherit;font-weight:500}
.filter-btn:hover{border-color:var(--border-hover);color:var(--text-primary)}
.filter-btn.active{background:var(--text-primary);border-color:var(--text-primary);color:#fff}
.search-box{display:flex;align-items:center;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:0 14px;gap:8px;flex:1;max-width:360px}
.search-box svg{width:16px;height:16px;color:var(--text-muted);flex-shrink:0}
.search-box input{background:none;border:none;outline:none;color:var(--text-primary);font-size:.82rem;padding:10px 0;width:100%;font-family:inherit}
.search-box input::placeholder{color:var(--text-muted)}
.btn-primary{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border:none;border-radius:var(--radius-sm);background:var(--text-primary);color:#fff;font-weight:600;font-size:.82rem;cursor:pointer;transition:all var(--transition);font-family:inherit}
.btn-primary:hover{background:var(--accent-black);box-shadow:var(--shadow-hover)}
.btn-primary svg{width:16px;height:16px}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid var(--border-color);border-radius:var(--radius-sm);background:transparent;color:var(--text-secondary);font-size:.78rem;cursor:pointer;transition:all var(--transition);font-family:inherit}
.btn-ghost:hover{border-color:var(--border-hover);color:var(--text-primary);background:var(--bg-secondary)}
.idea-list{display:flex;flex-direction:column;gap:12px}
.idea-card{display:flex;align-items:center;gap:16px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:16px;cursor:grab;box-shadow:var(--shadow-card);transition:all var(--transition)}
.idea-card:hover{box-shadow:var(--shadow-hover)}
.idea-card:active{cursor:grabbing}
.idea-card.sortable-chosen{border-color:var(--accent-dark);box-shadow:var(--shadow-hover)}
.idea-thumb{width:52px;height:52px;border-radius:var(--radius-sm);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.4rem;background:var(--bg-secondary)!important}
.idea-body{flex:1;min-width:0}
.idea-body .formula{font-size:.88rem;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idea-body .formula .hl{color:var(--accent-black);font-weight:700}
.idea-body .meta{font-size:.7rem;color:var(--text-muted)}
.idea-right{display:flex;align-items:center;gap:14px;flex-shrink:0}
.idea-status{padding:4px 12px;border-radius:12px;font-size:.7rem;font-weight:600;white-space:nowrap}
.status-draft{background:var(--bg-secondary);color:var(--accent-green)}
.status-making{background:var(--bg-secondary);color:var(--accent-orange)}
.status-published{background:var(--bg-secondary);color:var(--accent-red)}
.idea-score{font-size:.95rem;font-weight:700;color:var(--accent-black);white-space:nowrap}
.drag-handle{color:var(--text-muted);cursor:grab;width:20px;height:20px;flex-shrink:0}
.hotspot-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.hotspot-header .date-badge{font-size:.85rem;padding:6px 16px;border-radius:20px;background:var(--bg-secondary);color:var(--text-secondary);font-weight:500}
.word-cloud{display:flex;flex-wrap:wrap;gap:6px 12px;padding:20px;min-height:200px;align-items:center;justify-content:center}
.word-cloud .wc-item{cursor:default;transition:all var(--transition);padding:4px 8px;border-radius:4px}
.word-cloud .wc-item:hover{background:var(--bg-secondary);transform:scale(1.05)}
.suggestion-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:18px;margin-bottom:12px;box-shadow:var(--shadow-card)}
.suggestion-card .hot-label{font-size:.7rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.suggestion-card .suggestion-text{font-size:.82rem;line-height:1.6;color:var(--text-secondary)}
.suggestion-card .suggestion-text strong{color:var(--accent-black)}
.compare-row{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:20px}
.compare-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:18px 22px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow-card)}
.compare-card .cmp-icon{width:40px;height:40px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.compare-card .cmp-icon.up{background:var(--bg-secondary);color:var(--accent-green)}
.compare-card .cmp-icon.down{background:var(--bg-secondary);color:var(--accent-red)}
.compare-card .cmp-label{font-size:.72rem;color:var(--text-muted);margin-bottom:4px}
.compare-card .cmp-value{font-size:1.1rem;font-weight:700;color:var(--text-primary)}
.compare-card .cmp-delta{font-size:.78rem;font-weight:600;margin-top:2px}
.cmp-delta.up{color:var(--accent-green)}
.cmp-delta.down{color:var(--accent-red)}
.notes-area{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:20px;min-height:120px}
.notes-area textarea{width:100%;min-height:80px;background:transparent;border:none;outline:none;color:var(--text-primary);font-size:.82rem;font-family:inherit;resize:vertical;line-height:1.6}
.notes-area textarea::placeholder{color:var(--text-muted)}
.note-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--bg-secondary);font-size:.82rem;color:var(--text-secondary);line-height:1.5}
.note-item:last-child{border-bottom:none}
.note-item .note-dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted);flex-shrink:0;margin-top:6px}
.fab{position:fixed;bottom:32px;right:32px;width:52px;height:52px;border-radius:50%;background:var(--text-primary);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.15);transition:all var(--transition);z-index:100}
.fab:hover{background:var(--accent-black);transform:scale(1.05)}
.fab svg{width:22px;height:22px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:28px;width:480px;max-width:90vw;box-shadow:0 16px 48px rgba(0,0,0,0.2)}
.modal-box h3{font-size:1.05rem;font-weight:700;color:var(--text-primary);margin-bottom:6px}
.modal-box .modal-sub{font-size:.78rem;color:var(--text-muted);margin-bottom:20px}
.modal-box label{display:block;font-size:.78rem;color:var(--text-secondary);font-weight:500;margin-bottom:6px}
.modal-box input,.modal-box select,.modal-box textarea{width:100%;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text-primary);font-size:.82rem;font-family:inherit;outline:none;margin-bottom:14px;transition:border-color var(--transition)}
.modal-box input:focus,.modal-box select:focus,.modal-box textarea:focus{border-color:var(--accent-dark)}
.modal-box textarea{min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.btn-secondary{padding:10px 20px;border:1px solid var(--border-color);border-radius:var(--radius-sm);background:transparent;color:var(--text-secondary);font-size:.82rem;cursor:pointer;transition:all var(--transition);font-family:inherit;font-weight:500}
.btn-secondary:hover{background:var(--bg-secondary);color:var(--text-primary)}
.tooltip-trigger{position:relative;cursor:pointer}
.tooltip-trigger .tooltip-popup{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:10px 14px;font-size:.72rem;color:var(--text-secondary);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;box-shadow:0 4px 16px rgba(0,0,0,0.12);z-index:50}
.tooltip-trigger:hover .tooltip-popup{opacity:1}
.table-scroll{overflow-x:auto}
/* Insight / Strategy / Recommendation cards */
.insight-content{font-size:.85rem;line-height:1.8;color:var(--text-secondary)}
.insight-content strong{color:var(--text-primary)}
.insight-item{padding:8px 0;border-bottom:1px solid var(--bg-secondary)}
.insight-item:last-child{border-bottom:none}
.insight-tag{display:inline-block;font-size:.65rem;font-weight:600;padding:2px 8px;border-radius:4px;margin-right:6px;text-transform:uppercase}
.tag-blue{background:var(--bg-secondary);color:var(--accent-green)}
.tag-red{background:var(--bg-secondary);color:var(--accent-red)}
.tag-gray{background:var(--bg-secondary);color:var(--text-muted)}
.strategy-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.strategy-card{border:1px solid var(--border-color);border-radius:var(--radius-md);padding:16px}
.strategy-card .sc-title{font-size:.78rem;font-weight:700;margin-bottom:10px;text-transform:uppercase;letter-spacing:.3px}
.strategy-card .sc-item{font-size:.78rem;color:var(--text-secondary);padding:6px 0;border-bottom:1px solid var(--bg-secondary);line-height:1.5}
.strategy-card .sc-item:last-child{border-bottom:none}
.recommend-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rec-card{border:1px solid var(--border-color);border-radius:var(--radius-md);padding:16px}
.rec-card .rec-priority{font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:4px;display:inline-block;margin-bottom:8px}
.pri-p0{background:var(--text-primary);color:#fff}
.pri-p1{background:var(--bg-secondary);color:var(--text-primary)}
.rec-card .rec-title{font-size:.85rem;font-weight:600;margin-bottom:4px}
.rec-card .rec-reason{font-size:.75rem;color:var(--text-muted);line-height:1.5}
.strategy-content{font-size:.85rem;line-height:1.8;color:var(--text-secondary)}
.strategy-section{margin-bottom:16px}
.strategy-section:last-child{margin-bottom:0}
.strategy-section .ss-title{font-size:.78rem;font-weight:700;margin-bottom:8px;color:var(--text-primary);text-transform:uppercase;letter-spacing:.3px}
.strategy-section .ss-item{padding:6px 0;border-bottom:1px solid var(--bg-secondary)}
.strategy-section .ss-item:last-child{border-bottom:none}
.ss-item strong{color:var(--text-primary)}
@media(max-width:1024px){
.kpi-row{grid-template-columns:repeat(2,1fr)}
.two-col,.two-col-wide,.two-col-narrow{grid-template-columns:1fr}
.compare-row,.strategy-grid,.recommend-list{grid-template-columns:1fr}
}
@media(max-width:768px){
.sidebar{width:60px;min-width:60px;padding:16px 0}
.sidebar-brand{padding:0 12px 16px}
.sidebar-brand h1{font-size:0}
.sidebar-brand h1::after{content:'AI';font-size:.9rem;color:var(--text-primary)}
.sidebar-brand small{display:none}
.nav-item{padding:12px;margin:1px 6px;justify-content:center}
.nav-item span{display:none}
.nav-item .badge{display:none}
.nav-item svg{width:20px;height:20px}
.main-content{padding:20px 16px}
.kpi-row{grid-template-columns:1fr 1fr}
.cover-wall{grid-template-columns:repeat(3,1fr)}
.fab{bottom:20px;right:20px;width:48px;height:48px}
}
</style>
</head>
<body>
<div class="app-layout">
  <nav class="sidebar"><div class="sidebar-brand"><h1>选题分析</h1><small>AI漫剧驾驶舱</small></div>
  <button class="nav-item active" data-page="dashboard" onclick="switchPage('dashboard')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg><span>驾驶舱总览</span></button>
  <button class="nav-item" data-page="track" onclick="switchPage('track')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg><span>赛道风向标</span><span class="badge">8</span></button>
  <button class="nav-item" data-page="ideas" onclick="switchPage('ideas')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg><span>灵感选题库</span><span class="badge" id="ideaBadge">6</span></button>
  <button class="nav-item" data-page="hotspot" onclick="switchPage('hotspot')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><span>今日弹药库</span></button>
  <button class="nav-item" data-page="report" onclick="switchPage('report')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>周报分析室</span></button></nav>
  <main class="main-content" id="mainContent">
    <!-- Dashboard -->
    <div class="page active" id="page-dashboard">
      <div class="kpi-row" id="kpiRow"></div>
      <div class="two-col">
        <div class="card"><div class="card-header"><span class="card-title">今日实时飙升词条</span></div><div class="tag-cloud" id="hotTags"></div></div>
        <div class="card"><div class="card-header"><span class="card-title">近期爆款封面墙</span></div><div class="cover-wall" id="coverWall"></div></div>
      </div>
      <div class="full-row"><div class="card"><div class="card-header"><span class="card-title">近7天爆款题材分布趋势</span></div><div class="chart-container-lg"><canvas id="trendChart"></canvas></div></div></div>
      <div class="full-row"><div class="card"><div class="card-header"><span class="card-title">趋势解读</span></div><div class="insight-content" id="trendInsight"></div></div></div>
    </div>
    <!-- Track -->
    <div class="page" id="page-track">

{priority:'P1',title:'豪门商战 x 逆袭打脸',reason:'豪门赛道爆款率13.2%，适合精品化制作。「龙王觉醒」词频高，可与商战元素结合。'},

document.getElementById('recommendList').innerHTML=recs.map(r=>'<div class="rec-card"><span class="rec-priority '+(r.priority==='P0'?'pri-p0':'pri-p1')+'">'+r.priority+'</span><div class="rec-title">'+r.title+'</div><div class="rec-reason">'+r.reason+'</div></div>').join('')
}
// ===== Hotspot =====
function renderHotspot(){const n=new Date();document.getElementById('todayBadge').textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日';renderRadarChart();renderWordCloud();renderSuggestions()}
function renderRadarChart(){
const ctx=document.getElementById('radarChart');if(!ctx)return;destroyChart('radar');
chartInstances.radar=new Chart(ctx,{type:'radar',data:{labels:['AI漫剧','重生逆袭','甜宠','悬疑','古风','末世','豪门'],datasets:[{label:'热度指数',data:[95,88,72,85,78,65,82],backgroundColor:'rgba(0,0,0,0.06)',borderColor:'#000',pointBackgroundColor:'#000',pointBorderColor:'#fff',pointRadius:4,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{r:{grid:{color:'rgba(0,0,0,0.06)'},angleLines:{color:'rgba(0,0,0,0.06)'},pointLabels:{color:'#888',font:{size:10}},ticks:{color:'#888',backdropColor:'transparent',font:{size:9}},min:0,max:100}}}})
}
function renderWordCloud(){
const ws=[{text:'AI漫剧',w:95},{text:'重生',w:88},{text:'逆袭',w:82},{text:'总裁',w:78},{text:'虐恋',w:75},{text:'末世',w:70},{text:'机甲',w:68},{text:'古风',w:65},{text:'甜宠',w:62},{text:'豪门',w:60},{text:'悬疑',w:58},{text:'替身',w:55},{text:'龙王',w:52},{text:'觉醒',w:50},{text:'先婚后爱',w:48},{text:'商战',w:45}];
document.getElementById('hotWordCloud').innerHTML=ws.map(w=>{const s=.7+(w.w/100)*1.1;return'<span class="wc-item" style="font-size:'+s.toFixed(2)+'rem;color:#555;font-weight:'+(w.w>70?700:500)+';">'+w.text+'</span>'}).join('')
}
function renderSuggestions(){
const ss=[
{label:'Top 1 热点',text:'热点 <strong>「AI漫剧·总裁」</strong> 建议改编为 <strong>「豪门恩怨+AI换脸+反转打脸」</strong> 风格，参考对标账号 <strong>@AI短剧工厂</strong>。'},
{label:'Top 2 热点',text:'热点 <strong>「重生逆袭·机甲」</strong> 建议改编为 <strong>「末世+机甲+兄弟反目」</strong> 风格，参考对标账号 <strong>@机甲宇宙</strong> 的快节奏剪辑。'},
{label:'Top 3 热点',text:'热点 <strong>「古风虐恋·替身」</strong> 建议改编为 <strong>「替身文学+追妻火葬场」</strong> 风格，参考对标账号 <strong>@古风小剧场</strong>。'}];
document.getElementById('suggestionArea').innerHTML=ss.map(s=>'<div class="suggestion-card"><div class="hot-label">'+s.label+'</div><div class="suggestion-text">'+s.text+'</div></div>').join('')
}
// ===== Report =====
function renderReport(){renderCompare();renderHeatmap();renderScatter();renderNotes();renderStrategy_next()}
function renderCompare(){
document.getElementById('compareRow').innerHTML=
'<div class="compare-card"><div class="cmp-icon up"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></div><div><div class="cmp-label">本周总播放中位数</div><div class="cmp-value">128.5万</div><div class="cmp-delta up">↑ +18.3% vs 上周</div></div></div>'+
'<div class="compare-card"><div class="cmp-icon down"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg></div><div><div class="cmp-label">本周平均完播率</div><div class="cmp-value">34.2%</div><div class="cmp-delta down">↓ -2.1% vs 上周</div></div></div>'
}
function renderHeatmap(){
const ctx=document.getElementById('heatmapChart');if(!ctx)return;destroyChart('heatmap');
const words=['离婚协议','龙王觉醒','重生','替身','逆袭','机甲','虐恋','豪门','甜宠','悬疑'];
const scenes=['开场3秒','中段高潮','结尾反转'];
const vals=[[95,72,88,65,58,42,78,85,32,45],[55,88,68,72,82,65,52,48,58,62],[72,52,92,78,68,48,85,62,35,88]];
const data=[];vals.forEach((row,yi)=>{row.forEach((v,xi)=>{data.push({x:xi,y:yi,v})})});
chartInstances.heatmap=new Chart(ctx,{type:'matrix',data:{datasets:[{label:'词频',data,backgroundColor(ctx){const v=ctx.dataset.data[ctx.dataIndex].v;const a=v/100;return'rgba(0,0,0,'+(a*.6+.05)+')'},borderColor:'rgba(0,0,0,0.04)',borderWidth:1,width(ctx){const w=ctx.chart.chartArea?.width??300;return(w-10)/10-1},height(ctx){const h=ctx.chart.chartArea?.height??200;return(h-10)/3-1}}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title(){return''},label(ctx){const d=ctx.dataset.data[ctx.dataIndex];return words[d.x]+' · '+scenes[d.y]+': '+d.v}}}},scales:{x:{type:'category',labels:words,ticks:{color:'#888',font:{size:9},maxRotation:45},grid:{display:false}},y:{type:'category',labels:scenes,ticks:{color:'#888',font:{size:9}},grid:{display:false}}}}})
}
function renderScatter(){
const ctx=document.getElementById('scatterChart');if(!ctx)return;destroyChart('scatter');
chartInstances.scatter=new Chart(ctx,{type:'scatter',data:{datasets:[{label:'账号数据',data:[{x:1,y:12},{x:1,y:18},{x:2,y:22},{x:2,y:28},{x:3,y:35},{x:3,y:42},{x:4,y:38},{x:4,y:45},{x:5,y:42},{x:5,y:48},{x:6,y:40},{x:6,y:52},{x:7,y:45},{x:7,y:50},{x:8,y:42},{x:8,y:48}],backgroundColor:'rgba(0,0,0,0.3)',borderColor:'#000',pointRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>'日更'+ctx.parsed.x+'条 · 涨粉'+ctx.parsed.y+'万'}}},scales:{x:{title:{display:true,text:'日更新频率（条）',color:'#888',font:{size:10}},grid:{color:'rgba(0,0,0,0.04)'},ticks:{color:'#888',font:{size:9},stepSize:1}},y:{title:{display:true,text:'周涨粉量（万）',color:'#888',font:{size:10}},grid:{color:'rgba(0,0,0,0.04)'},ticks:{color:'#888',font:{size:9}},beginAtZero:true}}}})
}
function renderNotes(){
const area=document.getElementById('notesArea');
if(state.notes.length===0){area.innerHTML='<textarea placeholder="记录本周踩坑、避雷建议…" id="notesTextarea"></textarea>'}
else{area.innerHTML=state.notes.map(n=>'<div class="note-item"><span class="note-dot"></span><span>'+n+'</span><span style="margin-left:auto;cursor:pointer;color:var(--text-muted);font-size:.7rem;" onclick="deleteNote(\''+n.replace(/'/g,"\\'")+'\')">✕</span></div>').join('')+'<textarea placeholder="添加新的避雷记录…" id="notesTextarea" style="margin-top:8px;"></textarea>'}
}
function addNote(){const ta=document.getElementById('notesTextarea');const text=ta?ta.value.trim():'';if(!text)return;state.notes.push(text);saveState();renderNotes()}
function deleteNote(text){state.notes=state.notes.filter(n=>n!==text);saveState();renderNotes()}
function renderStrategy_next(){
document.getElementById('strategyContent').innerHTML=
'<div class="strategy-section"><div class="ss-title">内容方向</div><div class="ss-item"><strong>末世科幻优先</strong>：蓝海赛道热度持续上升，本周制作1条末世x机甲选题做测试。</div><div class="ss-item"><strong>悬疑持续投入</strong>：词频热力图显示「悬疑」「反转」在结尾场景出现率高，适合深度内容。</div></div>'+
'<div class="strategy-section"><div class="ss-title">制作优化</div><div class="ss-item"><strong>开场3秒强化</strong>：数据「离婚协议」「龙王觉醒」在开场场景词频最高，开场必须用强冲突钩子。</div><div class="ss-item"><strong>BGM选择</strong>：本周踩坑记录显示慢节奏BGM完播率-5%，下周统一使用快节奏配乐。</div></div>'+
'<div class="strategy-section"><div class="ss-title">发布时间</div><div class="ss-item"><strong>女频题材</strong>优先安排在 20:00-22:00 发布，完播率提升12%。</div><div class="ss-item"><strong>男频/悬疑题材</strong>适合 12:00-14:00 午间时段投放。</div></div>'
}
// ===== Modal =====
function openQuickNote(){document.getElementById('quickNoteModal').classList.add('open');const now=new Date();['modalTitle','modalFormula','modalScore','modalNote'].forEach(id=>{const el=document.getElementById(id);if(el&&id!=='modalScore')el.value=''});document.getElementById('modalScore').value='8'}
function closeQuickNote(){document.getElementById('quickNoteModal').classList.remove('open')}
function saveQuickNote(){
const title=document.getElementById('modalTitle').value.trim();
const formula=document.getElementById('modalFormula').value.trim()||title||'未命名选题';
const score=parseInt(document.getElementById('modalScore').value);
const note=document.getElementById('modalNote').value.trim();
if(!formula&&!title)return;
state.ideas.unshift({id:state.nextIdeaId++,formula,score,status:'draft',created:new Date().toISOString().slice(0,10).replace(/-/g,'/')});
if(note)state.notes.push('[灵感] '+note);saveState();closeQuickNote();
if(currentPage==='ideas')renderIdeas();document.getElementById('ideaBadge').textContent=state.ideas.length
}
// ===== Init =====
document.addEventListener('DOMContentLoaded',function(){
if(typeof lucide!=='undefined')lucide.createIcons();renderDashboard();
document.querySelectorAll('.filter-bar').forEach(bar=>{bar.addEventListener('click',function(e){const btn=e.target.closest('.filter-btn');if(!btn)return;const t=btn.dataset.filter;const grp=['day','week','month'].includes(t)?['day','week','month']:['douyin','kuaishou','hongguo'];bar.querySelectorAll('.filter-btn').forEach(b=>{if(grp.includes(b.dataset.filter))b.classList.remove('active')});btn.classList.add('active')})});
document.getElementById('quickNoteModal').addEventListener('click',function(e){if(e.target===this)closeQuickNote()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeQuickNote();if((e.key==='n')&&(e.ctrlKey||e.metaKey)){e.preventDefault();openQuickNote()}});
let rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(()=>{if(currentPage)renderPage(currentPage)},300)})
});
</script>
